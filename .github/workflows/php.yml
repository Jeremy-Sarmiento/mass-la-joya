name: PHP CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Sintaxis y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Comprobar sintaxis PHP
        run: find app config tests index.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Ejecutar pruebas de humo
        run: php tests/smoke.php
