name: Deploy to GitHub Pages

on:
  # Cada push a main recompila y publica el sitio.
  push:
    branches: [main]
  # Permite relanzarlo desde la pestana Actions.
  workflow_dispatch:

# GitHub Actions necesita pedir un token propio para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Compilar el sitio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      # pnpm debe existir antes que setup-node, porque el cache lo necesita.
      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar
        run: pnpm build
        env:
          # Subdirectorio en el que GitHub Pages publica el sitio.
          SITE_BASE: /mass-la-joya/
          # El ID real del pixel llega como secreto, no desde el repositorio.
          PUBLIC_META_PIXEL_ID: ${{ secrets.PUBLIC_META_PIXEL_ID }}

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
