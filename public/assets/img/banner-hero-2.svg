<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#082EB7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#051D75;stop-opacity:1" />
    </linearGradient>
    <filter id="b2_sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#bg2)"/>
  
  <circle cx="1000" cy="180" r="260" fill="#FFD100" opacity="0.12"/>
  
  <g transform="translate(70, 60)">
    <rect x="0" y="0" width="260" height="38" rx="19" fill="#FFD100"/>
    <text x="130" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#082EB7" text-anchor="middle">🔥 ENCARTE QUINCENAL</text>

    <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="48" fill="#FFD100" letter-spacing="-1">CATÁLOGO DE OFERTAS</text>
    <text x="0" y="170" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="48" fill="#ffffff" letter-spacing="-1">MASS DE LA JOYA</text>

    <text x="0" y="230" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#E2E8F0">Explora el encarte digital interactivo y añade directo a tu carrito</text>
    <text x="0" y="265" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#94A3B8">Válido para compras en tienda y pedidos por WhatsApp en La Joya</text>

    <g transform="translate(0, 305)">
      <rect x="0" y="0" width="260" height="54" rx="27" fill="#FFD100" filter="url(#b2_sh)"/>
      <text x="130" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" fill="#082EB7" text-anchor="middle">HOJEAR ENCARTE 📖</text>
    </g>
  </g>

  <!-- Flyer mockup graphics -->
  <g transform="translate(800, 45)">
    <rect x="20" y="15" width="280" height="360" rx="16" fill="#F8FAFC" filter="url(#b2_sh)"/>
    <rect x="20" y="15" width="280" height="60" rx="16" fill="#FFD100"/>
    <rect x="20" y="55" width="280" height="20" fill="#FFD100"/>
    <text x="160" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#082EB7" text-anchor="middle">mass LA JOYA</text>
    
    <!-- Mini product rows in flyer -->
    <rect x="40" y="90" width="115" height="110" rx="10" fill="#E2E8F0"/>
    <rect x="40" y="165" width="115" height="35" rx="8" fill="#E30613"/>
    <text x="97" y="188" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">S/ 3.80</text>

    <rect x="165" y="90" width="115" height="110" rx="10" fill="#E2E8F0"/>
    <rect x="165" y="165" width="115" height="35" rx="8" fill="#E30613"/>
    <text x="222" y="188" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">S/ 7.90</text>

    <rect x="40" y="215" width="240" height="75" rx="10" fill="#082EB7"/>
    <text x="160" y="245" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#FFD100" text-anchor="middle">¡PRECIOS SIN COMPETENCIA!</text>
    <text x="160" y="270" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">Ahorro comprobado para tu hogar</text>

    <rect x="40" y="305" width="240" height="45" rx="22" fill="#22C55E"/>
    <text x="160" y="333" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">PIDE DIRECTO A DOMICILIO</text>
