<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD100;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <filter id="b1_sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#bg1)"/>
  
  <!-- Circles & Decorative shapes -->
  <circle cx="1050" cy="240" r="280" fill="#082EB7" opacity="0.1"/>
  <circle cx="950" cy="380" r="140" fill="#082EB7" opacity="0.08"/>
  <circle cx="150" cy="50" r="100" fill="#ffffff" opacity="0.2"/>

  <!-- Left Content -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="280" height="40" rx="20" fill="#082EB7"/>
    <text x="140" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#FFD100" text-anchor="middle">📍 TIENDA LA JOYA - AREQUIPA</text>
    
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#082EB7" letter-spacing="-1">¡LOS MEJORES PRECIOS</text>
    <text x="0" y="165" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#082EB7" letter-spacing="-1">DEL BARRIO EN LA JOYA!</text>
    
    <text x="0" y="225" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#1E1E1E">Caser@, ahorra todos los días en tu canasta básica familiar</text>
    <text x="0" y="260" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#374151">✓ Abarrotes  ✓ Lácteos  ✓ Bebidas  ✓ Limpieza  ✓ Frescos de la zona</text>

    <!-- CTAs -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="240" height="54" rx="27" fill="#082EB7" filter="url(#b1_sh)"/>
      <text x="120" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFD100" text-anchor="middle">VER OFERTAS MASS ➔</text>

      <rect x="260" y="0" width="220" height="54" rx="27" fill="#25D366" filter="url(#b1_sh)"/>
      <text x="370" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">📱 PEDIR POR WHATSAPP</text>
    </g>
  </g>

  <!-- Right Graphic Illustration -->
  <g transform="translate(780, 50)">
    <rect x="0" y="20" width="340" height="340" rx="30" fill="#082EB7" filter="url(#b1_sh)"/>
    <!-- Big Mass Price Tag -->
    <rect x="25" y="45" width="290" height="70" rx="16" fill="#FFD100"/>
    <text x="170" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#082EB7" text-anchor="middle">PRECIOS MASS</text>
    
    <rect x="25" y="130" width="290" height="135" rx="16" fill="#ffffff"/>
    <text x="170" y="175" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#DC2626" text-anchor="middle">HASTA 40% DSCTO</text>
    <text x="170" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#4B5563" text-anchor="middle">En productos seleccionados</text>
    <text x="170" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#082EB7" text-anchor="middle">¡PAGA MENOS, LLEVA MASS!</text>

    <!-- Floating Badge -->
    <g transform="translate(190, 270)">
      <circle cx="50" cy="50" r="45" fill="#E30613" filter="url(#b1_sh)"/>
      <text x="50" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">OFERTÓN</text>
      <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FFD100" text-anchor="middle">MASS</text>
    </g>
  </g>
</svg>