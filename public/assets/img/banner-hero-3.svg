<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#047857;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#064E3B;stop-opacity:1" />
    </linearGradient>
    <filter id="b3_sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#bg3)"/>
  
  <g transform="translate(70, 60)">
    <rect x="0" y="0" width="270" height="38" rx="19" fill="#25D366"/>
    <text x="135" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle">🛵 DELIVERY EN LA JOYA</text>

    <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="48" fill="#FFD100" letter-spacing="-1">¡HAZ TU PEDIDO HOY!</text>
    <text x="0" y="170" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="48" fill="#ffffff" letter-spacing="-1">RÁPIDO Y DIRECTO A TU CASA</text>

    <text x="0" y="230" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#D1FAE5">Cobertura en: El Triunfo, San Camilo, San Isidro, Centro de La Joya</text>
    <text x="0" y="265" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#A7F3D0">Paga con Yape, Plin, Tarjeta POS o Efectivo contra entrega</text>

    <g transform="translate(0, 305)">
      <rect x="0" y="0" width="280" height="54" rx="27" fill="#FFD100" filter="url(#b3_sh)"/>
      <text x="140" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" fill="#064E3B" text-anchor="middle">COMPRAR ONLINE AHORA 🛒</text>
    </g>
  </g>

  <!-- Delivery Graphic -->
  <g transform="translate(800, 70)">
    <circle cx="170" cy="170" r="160" fill="#059669" opacity="0.6"/>
    <circle cx="170" cy="170" r="130" fill="#10B981" opacity="0.8"/>
    <!-- Scooter Delivery Icon Box -->
    <rect x="50" y="70" width="240" height="200" rx="20" fill="#ffffff" filter="url(#b3_sh)"/>
    <rect x="50" y="70" width="240" height="40" rx="20" fill="#25D366"/>
    <rect x="50" y="90" width="240" height="20" fill="#25D366"/>
    <text x="170" y="96" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">MASS EXPRESS LA JOYA</text>
    <text x="170" y="160" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#082EB7" text-anchor="middle">30 - 60 MIN</text>
    <text x="170" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#059669" text-anchor="middle">¡Tus víveres frescos y seguros!</text>
    <text x="170" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#E30613" text-anchor="middle">DELIVERY DESDE S/ 3.00</text>
  </g>
</svg>